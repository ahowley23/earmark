# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/earmark
spring.datasource.username=audreyhowley
spring.datasource.password=

# JPA/Hibernate — validate means Hibernate checks the schema matches
# your entities but never modifies it — Flyway owns schema changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=none
anthropic.api.key=replace-with-real-key
spring.profiles.active=local
spotify.client.id=replace-with-real-value
spotify.client.secret=replace-with-real-value
spotify.redirect.uri=replace-with-real-value
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
anthropic.api.key=${ANTHROPIC_API_KEY}
spotify.client.id=${SPOTIFY_CLIENT_ID}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET}
spotify.redirect.uri=${SPOTIFY_REDIRECT_URI}
